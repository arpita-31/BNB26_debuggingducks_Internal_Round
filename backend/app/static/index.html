<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLearn — Adaptive Multimodal Learning Environment</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81'
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = "";

    function App() {
      // Navigation & Mode
      const [currentTab, setCurrentTab] = useState("studio"); // 'studio', 'intervention', 'reassessment', 'learner', 'analytics'
      const [selectedDomain, setSelectedDomain] = useState("python_programming");
      
      // Question & Submission State
      const [questions, setQuestions] = useState([]);
      const [selectedQuestion, setSelectedQuestion] = useState(null);
      const [inputModality, setInputModality] = useState("text");
      const [textReasoning, setTextReasoning] = useState("");
      const [codeSnippet, setCodeSnippet] = useState("");
      const [imageFileNote, setImageFileNote] = useState("");

      // Diagnosis State
      const [isDiagnosing, setIsDiagnosing] = useState(false);
      const [diagnosisResult, setDiagnosisResult] = useState(null);
      const [pipelineStep, setPipelineStep] = useState(1); // 1 to 6
      const [activeProbe, setActiveProbe] = useState(null);

      // Intervention State
      const [interventionData, setInterventionData] = useState(null);
      const [microPracticeFeedback, setMicroPracticeFeedback] = useState(null);
      const [selectedOption, setSelectedOption] = useState(null);

      // Reassessment State
      const [reassessmentData, setReassessmentData] = useState(null);
      const [reassessmentText, setReassessmentText] = useState("");
      const [resolutionResult, setResolutionResult] = useState(null);
      const [isResolving, setIsResolving] = useState(false);

      // Learner & Analytics State
      const [learnerProfile, setLearnerProfile] = useState(null);
      const [curriculumRec, setCurriculumRec] = useState(null);
      const [modelMetrics, setModelMetrics] = useState(null);
      const [demoScenarios, setDemoScenarios] = useState([]);
      const [selectedScenarioId, setSelectedScenarioId] = useState("");

      // Load initial data
      useEffect(() => {
        loadQuestions();
        loadLearnerProfile();
        loadModelMetrics();
        loadDemoScenarios();
      }, []);

      const loadQuestions = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/questions`);
          const data = await res.json();
          setQuestions(data);
          if (data.length > 0) {
            setSelectedQuestion(data[0]);
            setCodeSnippet(data[0].code || "");
          }
        } catch (e) {
          console.error("Error loading questions", e);
        }
      };

      const loadLearnerProfile = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/learner/demo_learner`);
          const data = await res.json();
          setLearnerProfile(data);

          const recRes = await fetch(`${API_BASE}/api/recommendation/demo_learner`);
          const recData = await recRes.json();
          setCurriculumRec(recData);
        } catch (e) {
          console.error("Error loading learner profile", e);
        }
      };

      const loadModelMetrics = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/model/metrics`);
          const data = await res.json();
          setModelMetrics(data);
        } catch (e) {
          console.error("Error loading metrics", e);
        }
      };

      const loadDemoScenarios = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/demo/scenarios`);
          const data = await res.json();
          setDemoScenarios(data);
          if (data.length > 0) setSelectedScenarioId(data[0].id);
        } catch (e) {
          console.error("Error loading scenarios", e);
        }
      };

      // Handler: Run Diagnosis
      const handleDiagnose = async () => {
        if (!textReasoning.trim() && !codeSnippet.trim()) {
          alert("Please enter your reasoning or answer before submitting.");
          return;
        }

        setIsDiagnosing(true);
        setPipelineStep(2); // Feature Extraction
        
        try {
          const payload = {
            domain_id: selectedDomain,
            question_id: selectedQuestion ? selectedQuestion.id : "Q_PY_RANGE_01",
            learner_id: "demo_learner",
            submission: {
              modality: inputModality,
              text: textReasoning,
              code: codeSnippet,
              metadata: { note: imageFileNote }
            }
          };

          const res = await fetch(`${API_BASE}/api/diagnose`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          
          setDiagnosisResult(data);
          setPipelineStep(4); // Differentiation & Decision

          if (data.diagnostic_probe) {
            setActiveProbe(data.diagnostic_probe);
          } else {
            setActiveProbe(null);
          }

          loadLearnerProfile();
        } catch (e) {
          console.error("Diagnosis error", e);
        } finally {
          setIsDiagnosing(false);
        }
      };

      // Handler: Answer Diagnostic Probe
      const handleAnswerProbe = async (optionIndex) => {
        if (!activeProbe) return;
        try {
          const res = await fetch(`${API_BASE}/api/probe/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              probe_id: activeProbe.id,
              selected_option_index: optionIndex,
              learner_id: "demo_learner"
            })
          });
          const data = await res.json();
          
          // Update diagnosis with disambiguated misconception
          if (diagnosisResult) {
            setDiagnosisResult({
              ...diagnosisResult,
              prediction: {
                ...diagnosisResult.prediction,
                misconception_id: data.disambiguated_misconception_id,
                name: data.selected_option
              },
              differentiation: {
                ...diagnosisResult.differentiation,
                is_ambiguous: false,
                rationale: `Disambiguated via probe: ${data.explanation}`
              }
            });
          }
          setActiveProbe(null);
          loadLearnerProfile();
        } catch (e) {
          console.error("Probe error", e);
        }
      };

      // Handler: Start Intervention
      const handleStartIntervention = async (miscId, conf) => {
        try {
          const res = await fetch(`${API_BASE}/api/intervention`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              misconception_id: miscId || "M001",
              confidence: conf || 0.94,
              learner_id: "demo_learner"
            })
          });
          const data = await res.json();
          setInterventionData(data);
          setMicroPracticeFeedback(null);
          setSelectedOption(null);
          setPipelineStep(5); // Intervention
          setCurrentTab("intervention");
        } catch (e) {
          console.error("Intervention error", e);
        }
      };

      // Handler: Check Micro Practice
      const handleCheckPractice = async (idx) => {
        setSelectedOption(idx);
        try {
          const res = await fetch(`${API_BASE}/api/intervention/practice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              misconception_id: interventionData.misconception_id,
              selected_option_index: idx
            })
          });
          const data = await res.json();
          setMicroPracticeFeedback(data);
        } catch (e) {
          console.error("Practice error", e);
        }
      };

      // Handler: Fetch Reassessment
      const handlePrepareReassessment = async () => {
        try {
          const miscId = interventionData ? interventionData.misconception_id : "M001";
          const res = await fetch(`${API_BASE}/api/reassess`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              misconception_id: miscId,
              original_question_id: selectedQuestion ? selectedQuestion.id : null,
              learner_id: "demo_learner"
            })
          });
          const data = await res.json();
          setReassessmentData(data);
          setReassessmentText("");
          setResolutionResult(null);
          setPipelineStep(6); // Reassessment
          setCurrentTab("reassessment");
        } catch (e) {
          console.error("Reassessment error", e);
        }
      };

      // Handler: Verify Resolution
      const handleVerifyResolution = async () => {
        if (!reassessmentText.trim()) {
          alert("Please input your answer and reasoning for the transfer question.");
          return;
        }

        setIsResolving(true);
        try {
          const res = await fetch(`${API_BASE}/api/resolve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              reassessment_id: reassessmentData.question.id,
              misconception_id: reassessmentData.misconception_id,
              concept_id: reassessmentData.question.concept ? reassessmentData.question.concept.toLowerCase().replace(/ /g, "_") : "python_range",
              learner_response: reassessmentText,
              learner_code: "",
              learner_id: "demo_learner"
            })
          });
          const data = await res.json();
          setResolutionResult(data);
          loadLearnerProfile();
        } catch (e) {
          console.error("Resolution error", e);
        } finally {
          setIsResolving(false);
        }
      };

      // Handler: Run Guided Demo Scenario
      const handleRunDemoScenario = (scenarioId) => {
        const scenario = demoScenarios.find(s => s.id === scenarioId);
        if (!scenario) return;

        // Populate question
        const q = questions.find(item => item.id === scenario.question_id);
        if (q) {
          setSelectedQuestion(q);
          setCodeSnippet(q.code || "");
        }
        
        // Populate student submission with targeted misconception
        setTextReasoning(scenario.student_submission.text);
        if (scenario.student_submission.code) {
          setCodeSnippet(scenario.student_submission.code);
        }
        
        setCurrentTab("studio");
        setDiagnosisResult(null);
        setActiveProbe(null);
        setPipelineStep(1);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Bar Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                  <i className="fa-solid fa-brain text-white text-xl"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-bold text-xl tracking-tight text-white">ReLearn</span>
                    <span className="px-2 py-0.5 text-xs font-semibold rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                      Cognitive ML
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 hidden sm:block">Adaptive Multimodal Misconception Diagnostic Environment</p>
                </div>
              </div>

              {/* Domain & Demo Preset Selector */}
              <div className="flex items-center space-x-3">
                <div className="hidden lg:flex items-center bg-slate-950 border border-slate-800 rounded-lg p-1 text-xs">
                  <span className="px-2.5 py-1 rounded bg-indigo-600/20 text-indigo-300 font-medium border border-indigo-500/30">
                    <i className="fa-brands fa-python mr-1.5 text-emerald-400"></i> Python (Active)
                  </span>
                  <span className="px-2.5 py-1 text-slate-500 cursor-not-allowed" title="Abstract domain extension interface">
                    <i className="fa-solid fa-square-root-variable mr-1.5"></i> Math (Roadmap)
                  </span>
                  <span className="px-2.5 py-1 text-slate-500 cursor-not-allowed" title="Abstract domain extension interface">
                    <i className="fa-solid fa-atom mr-1.5"></i> Physics (Roadmap)
                  </span>
                </div>

                {/* Competition Demo Walkthrough Runner */}
                <div className="flex items-center bg-indigo-950/40 border border-indigo-800/40 rounded-lg p-1 space-x-2">
                  <select 
                    value={selectedScenarioId}
                    onChange={(e) => setSelectedScenarioId(e.target.value)}
                    className="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 max-w-[210px] truncate"
                  >
                    {demoScenarios.map(s => (
                      <option key={s.id} value={s.id}>{s.title}</option>
                    ))}
                  </select>
                  <button 
                    onClick={() => handleRunDemoScenario(selectedScenarioId)}
                    className="px-3 py-1.5 bg-gradient-to-r from-indigo-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 text-white font-medium text-xs rounded shadow transition flex items-center space-x-1.5"
                    title="Load Competition Scenario Preset into Pipeline"
                  >
                    <i className="fa-solid fa-play text-[10px]"></i>
                    <span>Load Scenario</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-1 border-t border-slate-800/60 overflow-x-auto text-xs font-medium">
              <button 
                onClick={() => setCurrentTab("studio")} 
                className={`py-2.5 px-4 border-b-2 flex items-center space-x-2 transition ${currentTab === "studio" ? "border-indigo-500 text-indigo-400 bg-indigo-500/5 font-semibold" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <i className="fa-solid fa-laptop-code"></i>
                <span>Learner Studio</span>
              </button>
              <button 
                onClick={() => setCurrentTab("intervention")} 
                className={`py-2.5 px-4 border-b-2 flex items-center space-x-2 transition ${currentTab === "intervention" ? "border-indigo-500 text-indigo-400 bg-indigo-500/5 font-semibold" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <i className="fa-solid fa-shapes"></i>
                <span>Targeted Intervention</span>
                {interventionData && <span className="w-2 h-2 rounded-full bg-emerald-400"></span>}
              </button>
              <button 
                onClick={() => setCurrentTab("reassessment")} 
                className={`py-2.5 px-4 border-b-2 flex items-center space-x-2 transition ${currentTab === "reassessment" ? "border-indigo-500 text-indigo-400 bg-indigo-500/5 font-semibold" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <i className="fa-solid fa-circle-check"></i>
                <span>Unseen Reassessment</span>
                {resolutionResult && <span className="w-2 h-2 rounded-full bg-emerald-400"></span>}
              </button>
              <button 
                onClick={() => { setCurrentTab("learner"); loadLearnerProfile(); }} 
                className={`py-2.5 px-4 border-b-2 flex items-center space-x-2 transition ${currentTab === "learner" ? "border-indigo-500 text-indigo-400 bg-indigo-500/5 font-semibold" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <i className="fa-solid fa-user-astronaut"></i>
                <span>Learner Model</span>
              </button>
              <button 
                onClick={() => { setCurrentTab("analytics"); loadModelMetrics(); }} 
                className={`py-2.5 px-4 border-b-2 flex items-center space-x-2 transition ${currentTab === "analytics" ? "border-indigo-500 text-indigo-400 bg-indigo-500/5 font-semibold" : "border-transparent text-slate-400 hover:text-slate-200"}`}
              >
                <i className="fa-solid fa-chart-line"></i>
                <span>Model Analytics (ML)</span>
              </button>
            </div>
          </header>

          {/* AI Reasoning Pipeline Tracker */}
          <div className="bg-slate-900 border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs">
              <span className="text-slate-400 font-semibold tracking-wider uppercase text-[11px] hidden md:inline">
                Cognitive Pipeline:
              </span>
              <div className="flex items-center space-x-2 sm:space-x-4 overflow-x-auto w-full md:w-auto">
                {[
                  { step: 1, label: "Response Ingestion", icon: "fa-keyboard" },
                  { step: 2, label: "Feature Extraction", icon: "fa-microchip" },
                  { step: 3, label: "Calibrated Diagnosis", icon: "fa-brain" },
                  { step: 4, label: "Differentiation", icon: "fa-code-compare" },
                  { step: 5, label: "Scaffolded Intervention", icon: "fa-lightbulb" },
                  { step: 6, label: "Transfer Resolution", icon: "fa-certificate" }
                ].map(item => (
                  <div key={item.step} className="flex items-center space-x-1.5 flex-shrink-0">
                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                      pipelineStep >= item.step 
                        ? "bg-indigo-600 text-white shadow-sm shadow-indigo-500/50" 
                        : "bg-slate-800 text-slate-500"
                    }`}>
                      {pipelineStep > item.step ? <i className="fa-solid fa-check text-[9px]"></i> : item.step}
                    </span>
                    <span className={`${pipelineStep === item.step ? "text-indigo-300 font-semibold" : "text-slate-400"}`}>
                      {item.label}
                    </span>
                    {item.step < 6 && <i className="fa-solid fa-chevron-right text-slate-700 text-[9px] ml-1"></i>}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {currentTab === "studio" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Left Column: Question & Multimodal Submission */}
                <div className="lg:col-span-7 space-y-5">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
                    {/* Question Header */}
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            {selectedQuestion ? selectedQuestion.concept : "Concept"}
                          </span>
                          <span className="px-2 py-0.5 rounded text-[11px] font-medium bg-slate-800 text-slate-300 capitalize">
                            {selectedQuestion ? selectedQuestion.difficulty : "beginner"}
                          </span>
                        </div>
                        <h2 className="text-lg font-bold text-white mt-1">
                          {selectedQuestion ? selectedQuestion.title : "Active Question"}
                        </h2>
                      </div>

                      {/* Question Switcher */}
                      <select 
                        className="bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded px-2.5 py-1.5 focus:border-indigo-500 focus:outline-none"
                        value={selectedQuestion ? selectedQuestion.id : ""}
                        onChange={(e) => {
                          const q = questions.find(item => item.id === e.target.value);
                          if (q) {
                            setSelectedQuestion(q);
                            setCodeSnippet(q.code || "");
                            setTextReasoning("");
                            setDiagnosisResult(null);
                          }
                        }}
                      >
                        {questions.map(q => (
                          <option key={q.id} value={q.id}>{q.title}</option>
                        ))}
                      </select>
                    </div>

                    {/* Question Prompt */}
                    <p className="text-sm text-slate-300 mt-3 whitespace-pre-line leading-relaxed">
                      {selectedQuestion ? selectedQuestion.prompt : ""}
                    </p>

                    {/* Code Display */}
                    {selectedQuestion && selectedQuestion.code && (
                      <div className="mt-4 rounded-lg bg-slate-950 border border-slate-800 p-3.5 relative overflow-hidden font-mono text-xs text-indigo-200">
                        <div className="absolute top-2 right-2.5 text-[10px] text-slate-500 font-sans uppercase font-bold tracking-wider">
                          Python 3.11
                        </div>
                        <pre className="overflow-x-auto">{selectedQuestion.code}</pre>
                      </div>
                    )}
                  </div>

                  {/* Multimodal Input Studio */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <h3 className="text-sm font-bold text-white flex items-center space-x-2">
                        <i className="fa-solid fa-pen-to-square text-indigo-400"></i>
                        <span>Learner Response & Reasoning Studio</span>
                      </h3>

                      {/* Modality Tabs */}
                      <div className="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                        <button 
                          onClick={() => setInputModality("text")}
                          className={`px-2.5 py-1 rounded transition ${inputModality === "text" ? "bg-indigo-600 text-white font-medium" : "text-slate-400 hover:text-white"}`}
                        >
                          <i className="fa-solid fa-align-left mr-1"></i> Text Reasoning
                        </button>
                        <button 
                          onClick={() => setInputModality("code")}
                          className={`px-2.5 py-1 rounded transition ${inputModality === "code" ? "bg-indigo-600 text-white font-medium" : "text-slate-400 hover:text-white"}`}
                        >
                          <i className="fa-solid fa-code mr-1"></i> Code Sandbox
                        </button>
                        <button 
                          onClick={() => setInputModality("image")}
                          className={`px-2.5 py-1 rounded transition ${inputModality === "image" ? "bg-indigo-600 text-white font-medium" : "text-slate-400 hover:text-white"}`}
                        >
                          <i className="fa-solid fa-camera mr-1"></i> OCR / Image
                        </button>
                      </div>
                    </div>

                    {/* Modality: Text Input */}
                    {inputModality === "text" && (
                      <div className="space-y-2">
                        <label className="text-xs text-slate-400 flex items-center justify-between">
                          <span>State your prediction and explain the underlying reasoning:</span>
                          <span className="text-[11px] text-indigo-400">Natural Language Reasoning</span>
                        </label>
                        <textarea 
                          rows={4}
                          value={textReasoning}
                          onChange={(e) => setTextReasoning(e.target.value)}
                          placeholder="e.g., 'The loop prints 1, 2, 3, 4, 5 because range(1, 5) includes the endpoint 5.'"
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-sans leading-relaxed"
                        ></textarea>
                      </div>
                    )}

                    {/* Modality: Code Input */}
                    {inputModality === "code" && (
                      <div className="space-y-2">
                        <label className="text-xs text-slate-400 flex items-center justify-between">
                          <span>Write or modify Python code snippet:</span>
                          <span className="text-[11px] text-emerald-400">AST Structural Parser Active</span>
                        </label>
                        <textarea 
                          rows={5}
                          value={codeSnippet}

                  <div className="space-y-6">
                    {/* Top Stats Banner */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                        <span className="text-xs text-slate-400 block">Overall Mastery</span>
                        <span className="text-2xl font-bold font-mono text-emerald-400 mt-1 block">
                          {(learnerProfile.overall_mastery * 100).toFixed(0)}%
                        </span>
                        <div className="w-full bg-slate-950 rounded-full h-1.5 mt-2 overflow-hidden">
                          <div className="bg-emerald-500 h-1.5 rounded-full" style={{ width: `${learnerProfile.overall_mastery * 100}%` }}></div>
                        </div>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                        <span className="text-xs text-slate-400 block">Active Misconceptions</span>
                        <span className="text-2xl font-bold font-mono text-rose-400 mt-1 block">
                          {learnerProfile.active_misconceptions.length}
                        </span>
                        <span className="text-[11px] text-slate-500">Requires intervention</span>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                        <span className="text-xs text-slate-400 block">Resolved Misconceptions</span>
                        <span className="text-2xl font-bold font-mono text-emerald-400 mt-1 block">
                          {learnerProfile.resolved_misconceptions.length}
                        </span>
                        <span className="text-[11px] text-slate-500">Verified via transfer</span>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                        <span className="text-xs text-slate-400 block">Tracked Concepts</span>
                        <span className="text-2xl font-bold font-mono text-indigo-400 mt-1 block">
                          {learnerProfile.concepts.length}
                        </span>
                        <span className="text-[11px] text-slate-500">Curriculum nodes</span>
                      </div>
                    </div>

                    {/* Adaptive Curriculum Planner Card */}
                    {curriculumRec && (
                      <div className="bg-gradient-to-r from-indigo-950/40 to-slate-900 border border-indigo-500/30 rounded-xl p-5 shadow space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center space-x-1.5">
                            <i className="fa-solid fa-route"></i>
                            <span>Adaptive Curriculum Recommendation</span>
                          </span>
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300">
                            Urgency: {curriculumRec.urgency}
                          </span>
                        </div>
                        <p className="text-sm font-semibold text-white">
                          Action: {curriculumRec.suggested_activity}
                        </p>
                        <p className="text-xs text-slate-300">
                          {curriculumRec.reason}
                        </p>
                      </div>
                    )}

                    {/* Concepts Mastery Breakdown */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-4">
                      <h3 className="text-sm font-bold text-white flex items-center space-x-2">
                        <i className="fa-solid fa-layer-group text-indigo-400"></i>
                        <span>Domain Concepts Mastery Vector</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {learnerProfile.concepts.map(c => (
                          <div key={c.concept_id} className="bg-slate-950 p-3.5 rounded-lg border border-slate-800 space-y-2">
                            <div className="flex items-center justify-between text-xs">
                              <span className="font-semibold text-slate-200">{c.name}</span>
                              <span className="font-mono text-emerald-400 font-bold">
                                {(c.mastery * 100).toFixed(0)}%
                              </span>
                            </div>
                            <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                              <div 
                                className="bg-indigo-500 h-2 rounded-full"
                                style={{ width: `${c.mastery * 100}%` }}
                              ></div>
                            </div>
                            <div className="flex items-center justify-between text-[10px] text-slate-500">
                              <span>Status: <strong className="text-slate-400">{c.status}</strong></span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Misconception Tracking Board */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {/* Active Misconceptions */}
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-3">
                        <h4 className="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center space-x-1.5">
                          <i className="fa-solid fa-triangle-exclamation"></i>
                          <span>Active / Suspected Fallacies</span>
                        </h4>
                        {learnerProfile.active_misconceptions.length === 0 ? (
                          <p className="text-xs text-slate-500 italic py-4">No active misconceptions recorded.</p>
                        ) : (
                          <div className="space-y-2">
                            {learnerProfile.active_misconceptions.map(m => (
                              <div key={m.misconception_id} className="bg-slate-950 p-3 rounded border border-slate-800 flex items-center justify-between text-xs">
                                <div>
                                  <span className="font-mono font-bold text-rose-400">{m.misconception_id}</span>
                                  <span className="text-slate-400 block text-[11px]">Occurrences: {m.occurrences} | Status: {m.status}</span>
                                </div>
                                <span className="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-300 border border-rose-500/20">
                                  Confidence: {(m.confidence * 100).toFixed(0)}%
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Resolved Misconceptions */}
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-3">
                        <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center space-x-1.5">
                          <i className="fa-solid fa-circle-check"></i>
                          <span>Resolved Misconceptions</span>
                        </h4>
                        {learnerProfile.resolved_misconceptions.length === 0 ? (
                          <p className="text-xs text-slate-500 italic py-4">No misconceptions resolved yet.</p>
                        ) : (
                          <div className="space-y-2">
                            {learnerProfile.resolved_misconceptions.map(m => (
                              <div key={m.misconception_id} className="bg-slate-950 p-3 rounded border border-slate-800 flex items-center justify-between text-xs">
                                <div>
                                  <span className="font-mono font-bold text-emerald-400">{m.misconception_id}</span>
                                  <span className="text-slate-400 block text-[11px]">Passed Unseen Transfer Problem</span>
                                </div>
                                <span className="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                                  Resolved
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: MODEL ANALYTICS & ML METRICS */}
            {currentTab === "analytics" && (
              <div className="max-w-5xl mx-auto space-y-6">
                {!modelMetrics ? (
                  <div className="py-12 text-center text-slate-400">Loading ML evaluation metrics...</div>
                ) : (
                  <div className="space-y-6">
                    {/* Header */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-2">
                      <div className="flex items-center justify-between">
                        <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                          <i className="fa-solid fa-chart-line text-indigo-400"></i>
                          <span>Empirical ML Pipeline Evaluation</span>
                        </h2>
                        <span className="px-2.5 py-0.5 rounded text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                          True Evaluated Metrics (Zero Fake Data)
                        </span>
                      </div>
                      <p className="text-xs text-slate-400">
                        Evaluated across {modelMetrics.dataset_statistics.training_samples} training samples and {modelMetrics.dataset_statistics.test_samples} held-out test samples over {modelMetrics.dataset_statistics.num_classes} distinct classes.
                      </p>
                    </div>

                    {/* Metric Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <span className="text-xs text-slate-400 block">Test Accuracy</span>
                        <span className="text-2xl font-bold font-mono text-emerald-400 mt-1 block">
                          {(modelMetrics.test_metrics.accuracy * 100).toFixed(2)}%
                        </span>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <span className="text-xs text-slate-400 block">Macro F1 Score</span>
                        <span className="text-2xl font-bold font-mono text-indigo-400 mt-1 block">
                          {modelMetrics.test_metrics.macro_f1.toFixed(4)}
                        </span>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <span className="text-xs text-slate-400 block">Weighted F1 Score</span>
                        <span className="text-2xl font-bold font-mono text-indigo-400 mt-1 block">
                          {modelMetrics.test_metrics.weighted_f1.toFixed(4)}
                        </span>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                        <span className="text-xs text-slate-400 block">Classes</span>
                        <span className="text-2xl font-bold font-mono text-white mt-1 block">
                          {modelMetrics.dataset_statistics.num_classes}
                        </span>
                      </div>
                    </div>

                    {/* Baseline Comparison Card */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-4">
                      <h3 className="text-sm font-bold text-white flex items-center space-x-2">
                        <i className="fa-solid fa-code-compare text-amber-400"></i>
                        <span>Scientific Baseline Comparison</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                          <span className="font-bold text-slate-300 block">{modelMetrics.baseline_comparison.baseline_model.name}</span>
                          <p className="text-slate-400">{modelMetrics.baseline_comparison.baseline_model.limitation}</p>
                          <div className="pt-2 border-t border-slate-800 flex justify-between font-mono">
                            <span>Diagnostic Resolution:</span>
                            <span className="text-rose-400 font-bold">0.0 (None)</span>
                          </div>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-indigo-500/30 space-y-2">
                          <span className="font-bold text-indigo-300 block">{modelMetrics.baseline_comparison.relearn_model.name}</span>
                          <p className="text-slate-400">{modelMetrics.baseline_comparison.relearn_model.advantage}</p>
                          <div className="pt-2 border-t border-slate-800 flex justify-between font-mono">
                            <span>Diagnostic Resolution:</span>
                            <span className="text-emerald-400 font-bold">1.0 (Full 11-Class Granularity)</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Confusion Matrix Heatmap */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow space-y-3">
                      <h3 className="text-sm font-bold text-white flex items-center space-x-2">
                        <i className="fa-solid fa-table-cells text-emerald-400"></i>
                        <span>Multi-Class Confusion Matrix (Held-Out Test Set)</span>
                      </h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-center text-xs font-mono">
                          <thead>
                            <tr className="border-b border-slate-800 text-slate-400">
                              <th className="p-2 text-left font-sans">True \ Pred</th>
                              {modelMetrics.test_metrics.classes.map(c => (
                                <th key={c} className="p-2">{c}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {modelMetrics.test_metrics.confusion_matrix.map((row, rowIdx) => (
                              <tr key={rowIdx} className="border-b border-slate-800/40">
                                <td className="p-2 text-left font-bold text-slate-300 font-sans">
                                  {modelMetrics.test_metrics.classes[rowIdx]}
                                </td>
                                {row.map((val, colIdx) => (
                                  <td 
                                    key={colIdx} 
                                    className={`p-2 ${
                                      val > 0 
                                        ? (rowIdx === colIdx ? "bg-emerald-500/30 text-emerald-200 font-bold" : "bg-rose-500/20 text-rose-300") 
                                        : "text-slate-600"
                                    }`}
                                  >
                                    {val}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 py-4 px-4 text-center text-xs text-slate-500">
            ReLearn — Adaptive Multimodal Learning Environment with Causal Cognitive Diagnosis &copy; 2026. Built with Python AST, Scikit-Learn Calibrated Classifier, FastAPI & React.
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
